name: QA Flame Chick catalog publication validation fixes V1

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "supabase/migrations/*_flame_chick_catalog_publication_validation_fixes_v1.sql"
      - "supabase/tests/catalog_publication_validation_fixes_v1.sql"
      - ".github/workflows/qa-catalog-publication-validation-fixes-v1.yml"

permissions:
  contents: read

concurrency:
  group: flame-chick-catalog-publication-validation-fixes-local-qa
  cancel-in-progress: false

jobs:
  local-migration-chain-and-fixture:
    if: github.ref == 'refs/heads/work/production-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --global "supabase@3.2.0"
          supabase --version
      - name: Validate candidate and fixture files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*_flame_chick_catalog_publication_validation_fixes_v1.sql' -print)
          test "${#migrations[@]}" -eq 1
          migration="${migrations[0]}"
          test -s "${migration}"
          test -s supabase/tests/catalog_publication_validation_fixes_v1.sql
          grep -q "HAVING g.min_units > 0" "${migration}"
          grep -q "ACTIVE_SCHEDULE_SET_INVALID" "${migration}"
          grep -q "CATALOG_VALIDATION_FIX_VERIFICATION_FAILED" "${migration}"
          grep -q "OPTIONAL_GROUP_WITHOUT_VARIANT_MAP_WAS_REJECTED" supabase/tests/catalog_publication_validation_fixes_v1.sql
          grep -q "REQUIRED_GROUP_MISSING_VARIANT_MAP_WAS_NOT_REJECTED" supabase/tests/catalog_publication_validation_fixes_v1.sql
          grep -q "UNREFERENCED_EMPTY_SCHEDULE_WAS_REJECTED" supabase/tests/catalog_publication_validation_fixes_v1.sql
      - name: Start clean disposable Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - name: Apply complete migration history locally
        run: supabase db reset --local
      - name: Run rollback-only catalog validation fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/catalog_publication_validation_fixes_v1.sql
      - name: Verify fixture rollback left no test tenant
        run: |
          set -euo pipefail
          result="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -Atqc "select count(*) from public.restaurants where slug='qa-catalog-validator-v1'")"
          test "${result}" = "0"
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
