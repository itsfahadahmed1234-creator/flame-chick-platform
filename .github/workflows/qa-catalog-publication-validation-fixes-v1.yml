name: QA Flame Chick catalog publication validation fixes V1

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "supabase/migrations/*.sql"
      - "supabase/tests/catalog_publication_validation_fixes_v1.sql"
      - ".github/workflows/qa-catalog-publication-validation-fixes-v1.yml"
      - "ops/triggers/qa-catalog-publication-validation-fixes-v1.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flame-chick-catalog-publication-validation-fixes-local-qa
  cancel-in-progress: false

jobs:
  local-migration-chain-and-fixture:
    if: github.ref == 'refs/heads/work/production-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --global "supabase@3.2.0"
          supabase --version
      - name: Validate candidate and fixture files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f -name '*_flame_chick_catalog_publication_validation_fixes_v1.sql' -print)
          test "${#migrations[@]}" -eq 1
          migration="${migrations[0]}"
          test -s "${migration}"
          test -s supabase/tests/catalog_publication_validation_fixes_v1.sql
          grep -q "HAVING g.min_units > 0" "${migration}"
          grep -q "ACTIVE_SCHEDULE_SET_INVALID" "${migration}"
          grep -q "CATALOG_VALIDATION_FIX_VERIFICATION_FAILED" "${migration}"
          grep -q "CATALOG_PUBLICATION_HELPER_SECURITY_BASELINE_INVALID" "${migration}"
          grep -q "6f3ba61ae717bd7e9863b537e2e8b8de" "${migration}"
          grep -q "cd683ec5284e5c64d1af6ff526af4b43" "${migration}"
          grep -q "OPTIONAL_GROUP_WITHOUT_VARIANT_MAP_WAS_REJECTED" supabase/tests/catalog_publication_validation_fixes_v1.sql
          grep -q "REQUIRED_GROUP_MISSING_VARIANT_MAP_WAS_NOT_REJECTED" supabase/tests/catalog_publication_validation_fixes_v1.sql
          grep -q "COLLECTION_WITHOUT_ACTIVE_DEAL_SCHEDULE_WAS_REJECTED" supabase/tests/catalog_publication_validation_fixes_v1.sql
          grep -q "INACTIVE_DEAL_SCHEDULE_WAS_REJECTED" supabase/tests/catalog_publication_validation_fixes_v1.sql
          grep -q "UNUSED_OR_INACTIVE_DEAL_SCHEDULE_WAS_COMPILED" supabase/tests/catalog_publication_validation_fixes_v1.sql
      - name: Start local Supabase with hosted-only helper compatibility
        shell: bash
        run: |
          set -euo pipefail
          parked="${RUNNER_TEMP}/flame-chick-migrations"
          test -d supabase/migrations
          test ! -e "${parked}"
          mv supabase/migrations "${parked}"
          mkdir -p supabase/migrations

          restore_migrations() {
            rm -rf supabase/migrations
            mv "${parked}" supabase/migrations
          }
          trap restore_migrations EXIT

          # Start the disposable stack without app migrations so the local-only
          # compatibility symbol can be installed before the historical first migration.
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector

          # Hosted Supabase provides public.rls_auto_enable() as a managed helper.
          # The local stack does not. This no-op event-trigger function exists only
          # in this disposable CI database so the immutable hardening migration can
          # revoke client EXECUTE exactly as it does on the hosted project.
          # We deliberately do not create an event trigger or change any repository SQL.
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 <<'SQL'
          DO $bootstrap$
          BEGIN
            IF to_regprocedure('public.rls_auto_enable()') IS NULL THEN
              EXECUTE $ddl$
                CREATE FUNCTION public.rls_auto_enable()
                RETURNS event_trigger
                LANGUAGE plpgsql
                AS $function$
                BEGIN
                  RETURN;
                END;
                $function$
              $ddl$;
            END IF;
          END
          $bootstrap$;
          SQL

          restore_migrations
          trap - EXIT
      - name: Apply complete migration history locally
        run: |
          set -euo pipefail
          supabase migration up --local
          expected="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          applied="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -Atqc "select count(*) from supabase_migrations.schema_migrations")"
          test "${applied}" = "${expected}"
      - name: Run rollback-only catalog validation fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 \
            --file supabase/tests/catalog_publication_validation_fixes_v1.sql
      - name: Verify fixture rollback left no test tenant
        run: |
          set -euo pipefail
          result="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -Atqc "select count(*) from public.restaurants where slug='qa-catalog-validator-v1'")"
          test "${result}" = "0"
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
