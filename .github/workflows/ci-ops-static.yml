name: Flame Chick POS and Rider Static Checks

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "apps/flame-chick-pos/**"
      - "apps/flame-chick-rider/**"
      - "tests/ops-source-hygiene.test.mjs"
      - "tests/pos-payment-collection.test.mjs"
      - "tests/pos-catalog-v3-adapter.test.mjs"
      - "tests/fixtures/catalog-v3-fixture.cjs"
      - "apps/flame-chick-website/js/catalog-v3.js"
      - "apps/flame-chick-website/js/catalog-v3-deal-view.js"
      - ".github/workflows/ci-ops-static.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check POS and Rider source
        run: node --test tests/ops-source-hygiene.test.mjs tests/pos-payment-collection.test.mjs tests/pos-catalog-v3-adapter.test.mjs
