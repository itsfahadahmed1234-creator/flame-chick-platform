name: Flame Chick Staff Admin Role Boundary QA

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "supabase/migrations/*.sql"
      - "supabase/tests/batch4_staff_admin_role_boundary.sql"
      - "supabase/tests/batch4_staff_admin_security.sql"
      - "supabase/tests/flame_chick_operational_schema_v1.sql"
      - "supabase/tests/flame_chick_pos_order_sync_v1.sql"
      - "supabase/tests/flame_chick_delivery_commands_v1.sql"
      - "supabase/tests/flame_chick_website_order_create_v1.sql"
      - "supabase/tests/flame_chick_website_order_route_setup.sql"
      - "supabase/tests/flame_chick_website_order_route_verify.sql"
      - "supabase/tests/flame_chick_website_order_route_teardown_guard.sql"
      - "supabase/functions/flame-chick-order-api/index_local_test.ts"
      - "supabase/functions/flame-chick-delivery-api/index.ts"
      - "supabase/functions/flame-chick-delivery-api/index_test.ts"
      - "apps/flame-chick-rider/index.html"
      - "tests/fixtures/catalog-v3-fixture.cjs"
      - "supabase/tests/flame_chick_delivery_concurrency_setup.sql"
      - "supabase/tests/flame_chick_delivery_concurrency.sh"
      - ".github/workflows/qa-staff-admin-role-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flame-chick-staff-admin-role-boundary-local-qa
  cancel-in-progress: false

jobs:
  isolated-role-boundary:
    if: github.ref == 'refs/heads/work/production-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --global "supabase@3.2.0"
          supabase --version
      - name: Validate fixture safeguards
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/tests/batch4_staff_admin_security.sql
          test -s supabase/tests/batch4_staff_admin_role_boundary.sql
          for marker in STAFF_ROLE_BOUNDARY_ADMIN_ACCESS_FAILED STAFF_ROLE_BOUNDARY_OWNER_ACCESS_FAILED STAFF_ROLE_BOUNDARY_%_WAS_GRANTED_ADMIN_ACCESS STAFF_ROLE_BOUNDARY_MISSING_JWT_WAS_ACCEPTED STAFF_ROLE_BOUNDARY_DIRECT_TABLE_PRIVILEGE; do
            grep -q "$marker" supabase/tests/batch4_staff_admin_role_boundary.sql
          done
          grep -q "ROLLBACK;" supabase/tests/batch4_staff_admin_role_boundary.sql
          test -s supabase/tests/flame_chick_delivery_concurrency_setup.sql
          test -s supabase/tests/flame_chick_delivery_concurrency.sh
          bash -n supabase/tests/flame_chick_delivery_concurrency.sh
          grep -q "pg_sleep" supabase/tests/flame_chick_delivery_concurrency_setup.sql
          grep -q "FOR UPDATE OF t SKIP LOCKED" supabase/migrations/20261124033422_flame_chick_delivery_commands_v1.sql
          grep -q "race 4/4" supabase/tests/flame_chick_delivery_concurrency.sh
          grep -q "payment race 6/6" supabase/tests/flame_chick_delivery_concurrency.sh
          grep -q "test.payment.race_delay" supabase/tests/flame_chick_delivery_concurrency_setup.sql
          test -s supabase/tests/flame_chick_website_order_create_v1.sql
          test -s supabase/tests/flame_chick_website_order_route_setup.sql
          test -s supabase/tests/flame_chick_website_order_route_verify.sql
          test -s supabase/tests/flame_chick_website_order_route_teardown_guard.sql
          test -s supabase/functions/flame-chick-order-api/index_local_test.ts
          grep -q "handleOrderApiRequest" supabase/functions/flame-chick-order-api/index_local_test.ts
          grep -q "WEBSITE_ORDER_ROUTE_VERIFY_FINANCIAL_OR_DELIVERY_STATE_INVALID" supabase/tests/flame_chick_website_order_route_verify.sql
          grep -q "WEBSITE_ONE_MINUTE_QUOTA_NOT_ENFORCED" supabase/tests/flame_chick_website_order_create_v1.sql
          grep -q "WEBSITE_TEN_MINUTE_QUOTA_NOT_ENFORCED" supabase/tests/flame_chick_website_order_create_v1.sql
          grep -q "WEBSITE_HOURLY_QUOTA_NOT_ENFORCED" supabase/tests/flame_chick_website_order_create_v1.sql
          grep -q "CREATE OR REPLACE FUNCTION public.flame_chick_create_website_order" supabase/migrations/20261124033430_flame_chick_website_order_create_v1.sql
          grep -q "CREATE OR REPLACE FUNCTION public.flame_chick_get_website_order_by_idempotency" supabase/migrations/20261124033433_flame_chick_website_order_idempotency_lookup_v1.sql
      - name: Start disposable Supabase with hosted-only helper compatibility
        shell: bash
        run: |
          set -euo pipefail
          parked="${RUNNER_TEMP}/flame-chick-migrations"
          mv supabase/migrations "$parked"
          mkdir -p supabase/migrations
          restore_migrations() { rm -rf supabase/migrations; mv "$parked" supabase/migrations; }
          trap restore_migrations EXIT
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 <<'SQL'
          DO $bootstrap$
          BEGIN
            IF to_regprocedure('public.rls_auto_enable()') IS NULL THEN
              EXECUTE $ddl$
                CREATE FUNCTION public.rls_auto_enable()
                RETURNS event_trigger LANGUAGE plpgsql AS $function$
                BEGIN RETURN; END;
                $function$
              $ddl$;
            END IF;
          END
          $bootstrap$;
          SQL
          restore_migrations
          trap - EXIT
      - name: Replay complete migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration up --local
          expected="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          applied="$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -Atqc "select count(*) from supabase_migrations.schema_migrations")"
          test "$applied" = "$expected"
      - name: Verify staff ACL and RLS baseline
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/batch4_staff_admin_security.sql
      - name: Exercise Admin, Owner and operational-role authorization
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/batch4_staff_admin_role_boundary.sql
      - name: Verify all synthetic identities and role rows rolled back
        shell: bash
        run: |
          set -euo pipefail
          db="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          test "$(psql "$db" -Atqc "select count(*) from auth.users where email like 'qa-staff-admin-%@example.invalid'")" = "0"
          test "$(psql "$db" -Atqc "select count(*) from public.user_roles ur join public.restaurants r on r.id=ur.restaurant_id where r.slug='flame-chick'")" = "0"
          test "$(psql "$db" -Atqc "select count(*) from public.staff_role_audit a join public.restaurants r on r.id=a.restaurant_id where r.slug='flame-chick'")" = "0"
      - name: Verify operational schema V1 constraints and security
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/flame_chick_operational_schema_v1.sql
      - name: Exercise delivery offer, pickup, delivery and physical return commands
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/flame_chick_delivery_commands_v1.sql
      - name: Exercise unified POS sync for Dine-in, Takeaway, Delivery and payment idempotency
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/flame_chick_pos_order_sync_v1.sql
      - name: Exercise V3 website order creation, idempotency and phone quotas
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/flame_chick_website_order_create_v1.sql
      - name: Set up Deno for local Website Order API integration
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.x"
      - name: Verify Rider Web Push fails closed until encrypted implementation is ready
        run: deno test --allow-env supabase/functions/flame-chick-delivery-api/index_test.ts
      - name: Exercise actual Website Order API against disposable local PostgREST and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          db="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          snapshot_b64="$(node - <<'NODE'
          const fixture = require("./tests/fixtures/catalog-v3-fixture.cjs");
          const snapshot = fixture.createSnapshot();
          snapshot.publicationNumber = 2;
          snapshot.draftRevision = 92;
          snapshot.pricingEngineVersion = "flame-chick-pricing-v1";
          process.stdout.write(Buffer.from(JSON.stringify(snapshot), "utf8").toString("base64"));
          NODE
          )"
          psql "$db" --set ON_ERROR_STOP=1 --set snapshot_b64="$snapshot_b64" --file supabase/tests/flame_chick_website_order_route_setup.sql

          supabase status -o env > "$RUNNER_TEMP/flame-chick-local-supabase.env"
          set -a
          . "$RUNNER_TEMP/flame-chick-local-supabase.env"
          set +a
          test -n "${API_URL:-}"
          test -n "${DB_URL:-}"
          test -n "${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          test -n "${SERVICE_ROLE_KEY:-}"

          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="${ANON_KEY:-}"
          export SUPABASE_PUBLISHABLE_KEYS="$(node -e 'const key=process.env.PUBLISHABLE_KEY || process.env.ANON_KEY; if (!key) process.exit(2); process.stdout.write(JSON.stringify({local:key}));')"
          export SUPABASE_SECRET_KEYS="$(node -e 'const key=process.env.SERVICE_ROLE_KEY; if (!key) process.exit(2); process.stdout.write(JSON.stringify({default:key}));')"
          export FLAME_CHICK_WEBSITE_QUOTE_HMAC_SECRET="disposable-local-website-quote-hmac-secret-32-bytes-min"
          export FLAME_CHICK_ORDER_PHONE_HMAC_SECRET="disposable-local-order-phone-hmac-secret-32-bytes-min"

          deno test --allow-env --allow-read --allow-net=127.0.0.1,localhost --allow-run=psql supabase/functions/flame-chick-order-api/index_local_test.ts
          psql "$DB_URL" --set ON_ERROR_STOP=1 --file supabase/tests/flame_chick_website_order_route_verify.sql
          psql "$DB_URL" --set ON_ERROR_STOP=1 --file supabase/tests/flame_chick_website_order_route_teardown_guard.sql

      - name: Prepare committed fixtures for parallel delivery race tests
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" --set ON_ERROR_STOP=1 --file supabase/tests/flame_chick_delivery_concurrency_setup.sql
      - name: Exercise simultaneous accept, decline and expiry sessions
        run: bash supabase/tests/flame_chick_delivery_concurrency.sh
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
