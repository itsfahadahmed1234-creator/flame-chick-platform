name: Create Flame Chick menu V1 migration file

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "ops/triggers/create-menu-v1-migration.txt"

permissions:
  contents: write

concurrency:
  group: flame-chick-menu-v1-migration-file
  cancel-in-progress: false

jobs:
  create-migration-file:
    if: github.ref == 'refs/heads/work/production-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the reviewed working branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --global "supabase@3.2.0"
          supabase --version

      - name: Create the timestamped migration using the Supabase CLI
        id: migration
        shell: bash
        run: |
          set -euo pipefail

          supabase migration new flame_chick_menu_v1_catalog

          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*_flame_chick_menu_v1_catalog.sql' -print | sort)
          test "${#files[@]}" -eq 1 || { echo "::error::Expected exactly one generated migration file"; exit 1; }

          file="${files[0]}"
          version="$(basename "${file}" | cut -d_ -f1)"
          [[ "${version}" =~ ^[0-9]{14}$ ]] || { echo "::error::Invalid migration timestamp"; exit 1; }
          test "${version}" -gt "20261121062000" || { echo "::error::Generated migration sorts before the current catalog foundation"; exit 1; }
          test ! -s "${file}" || { echo "::error::Generated migration file was unexpectedly non-empty"; exit 1; }

          echo "file=${file}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Commit only the generated empty migration file
        env:
          MIGRATION_FILE: ${{ steps.migration.outputs.file }}
          MIGRATION_VERSION: ${{ steps.migration.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${MIGRATION_FILE}"
          git commit -m "chore(db): create menu v1 migration scaffold ${MIGRATION_VERSION}"
          git push origin HEAD:work/production-source-audit

      - name: Report generated path
        env:
          MIGRATION_FILE: ${{ steps.migration.outputs.file }}
          MIGRATION_VERSION: ${{ steps.migration.outputs.version }}
        run: |
          {
            echo "### Menu V1 migration scaffold"
            echo "- Generated with Supabase CLI v3.2.0."
            echo "- File: ${MIGRATION_FILE}"
            echo "- Version: ${MIGRATION_VERSION}"
            echo "- The file is intentionally empty until the reviewed SQL candidate is added."
            echo "- No Supabase credentials or database connection were used."
          } >> "${GITHUB_STEP_SUMMARY}"
