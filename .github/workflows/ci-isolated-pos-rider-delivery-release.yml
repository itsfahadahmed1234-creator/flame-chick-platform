name: Isolated POS Rider Delivery Release Checks

on:
  push:
    branches:
      - release/pos-rider-delivery-optimization-2026-11-28
    paths:
      - "apps/flame-chick-pos/index.html"
      - "apps/flame-chick-pos/tests/delivery-refresh-optimization.test.cjs"
      - "supabase/functions/flame-chick-delivery-api/**"
      - ".github/workflows/ci-isolated-pos-rider-delivery-release.yml"

permissions:
  contents: read

jobs:
  isolated-release-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.x"
      - name: POS delivery refresh regression
        run: node --test apps/flame-chick-pos/tests/delivery-refresh-optimization.test.cjs
      - name: Delivery API mocked regression
        run: deno test --allow-env --allow-read supabase/functions/flame-chick-delivery-api/index_test.ts
