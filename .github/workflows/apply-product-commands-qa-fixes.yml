name: Apply Flame Chick product command QA fixes

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "ops/triggers/apply-product-commands-qa-fixes.txt"

permissions:
  contents: read

concurrency:
  group: flame-chick-production-product-command-qa-fixes
  cancel-in-progress: false

jobs:
  apply-product-command-fixes:
    if: github.ref == 'refs/heads/work/production-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: adkrxfnawdiljhjaavnj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate target and forward-only QA migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DB_PASSWORD}"
          configured_ref="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -n 1)"
          test "${configured_ref}" = "${SUPABASE_PROJECT_REF}"
          migration="supabase/migrations/20261121145500_flame_chick_catalog_product_commands_v1_qa_fixes.sql"
          test -s "${migration}"
          grep -q "CATALOG_VARIANT_ID_DUPLICATED" "${migration}"
          grep -q "IS DISTINCT FROM 'array'" "${migration}"
          test "$(grep -c '^BEGIN;$' "${migration}")" -eq 1
          test "$(grep -c '^COMMIT;$' "${migration}")" -eq 1
      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --global "supabase@3.2.0"
          supabase --version
      - name: Link and inspect remote ledger
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_REF}"
          supabase migration list --remote="${SUPABASE_PROJECT_REF}" | tee /tmp/migrations-before.txt
          for version in 20261121140000 20261121144209; do
            awk -F'|' -v version="${version}" '$2 ~ version { found=1 } END { exit(found ? 0 : 1) }' /tmp/migrations-before.txt
          done
          if awk -F'|' '$2 ~ /20261121145500/ { found=1 } END { exit(found ? 0 : 1) }' /tmp/migrations-before.txt; then
            echo "::error::QA correction already recorded remotely."
            exit 1
          fi
      - name: Dry-run and require only QA migration pending
        run: |
          set -euo pipefail
          supabase db push --dry-run --remote="${SUPABASE_PROJECT_REF}" 2>&1 | tee /tmp/dry-run.txt
          grep -q "20261121145500" /tmp/dry-run.txt
          for version in             20261119125153 20261120154413 20261120164125             20261121043115 20261121043149 20261121053647             20261121053712 20261121053829 20261121054852             20261121055722 20261121061000 20261121062000             20261121125542 20261121133607 20261121140000 20261121144209; do
            if grep -q "${version}" /tmp/dry-run.txt; then
              echo "::error::Unexpected historical migration pending: ${version}"
              exit 1
            fi
          done
      - name: Apply single forward-only QA migration
        run: |
          set -euo pipefail
          supabase db push --yes --remote="${SUPABASE_PROJECT_REF}"
      - name: Verify QA migration ledger
        run: |
          set -euo pipefail
          supabase migration list --remote="${SUPABASE_PROJECT_REF}" | tee /tmp/migrations-after.txt
          awk -F'|' '$2 ~ /20261121145500/ { found=1 } END { exit(found ? 0 : 1) }' /tmp/migrations-after.txt
          {
            echo "### Flame Chick product command QA fixes"
            echo "- Project: ${SUPABASE_PROJECT_REF}"
            echo "- Migration: 20261121145500"
            echo "- Applied as a separate forward-only migration."
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
