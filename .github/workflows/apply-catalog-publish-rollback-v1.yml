name: Apply Flame Chick catalog publish and rollback V1

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "ops/triggers/apply-catalog-publish-rollback-v1.txt"

permissions:
  contents: read

concurrency:
  group: flame-chick-production-catalog-publish-rollback-v1
  cancel-in-progress: false

jobs:
  apply-catalog-publish-rollback:
    if: github.ref == 'refs/heads/work/production-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_PROJECT_REF: adkrxfnawdiljhjaavnj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate target and publication migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DB_PASSWORD}"
          configured_ref="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -n 1)"
          test "${configured_ref}" = "${SUPABASE_PROJECT_REF}"
          migration="supabase/migrations/20261122031027_flame_chick_catalog_publish_rollback_v1.sql"
          test -s "${migration}"
          for marker in \
            "flame_chick_catalog_publication_validate" \
            "flame_chick_catalog_compile_snapshot" \
            "flame_chick_catalog_publish_internal" \
            "flame_chick_catalog_rollback_internal" \
            "flame_chick_catalog_publication_history_internal" \
            "CATALOG_PUBLISH_VALIDATION_FAILED" \
            "CATALOG_ROLLBACK_TARGET_CHECKSUM_MISMATCH" \
            "flame-chick-pricing-v1"; do
            grep -q "${marker}" "${migration}"
          done
          test "$(grep -c '^BEGIN;$' "${migration}")" -eq 1
          test "$(grep -c '^COMMIT;$' "${migration}")" -eq 1
      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --global "supabase@3.2.0"
          supabase --version
      - name: Link and verify previous migration history
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_REF}"
          supabase migration list --remote="${SUPABASE_PROJECT_REF}" | tee /tmp/migrations-before.txt
          for version in \
            20261121061000 20261121062000 20261121125542 20261121133607 \
            20261121140000 20261121144209 20261121145500 20261121150452 \
            20261121152231 20261121153223 20261121154711 20261121155900; do
            awk -F'|' -v version="${version}" '$2 ~ version { found=1 } END { exit(found ? 0 : 1) }' /tmp/migrations-before.txt || {
              echo "::error::Expected prior migration missing: ${version}"
              exit 1
            }
          done
          if awk -F'|' '$2 ~ /20261122031027/ { found=1 } END { exit(found ? 0 : 1) }' /tmp/migrations-before.txt; then
            echo "::error::Publication migration already recorded."
            exit 1
          fi
      - name: Dry-run — require publication migration as the only pending change
        run: |
          set -euo pipefail
          supabase db push --dry-run --remote="${SUPABASE_PROJECT_REF}" 2>&1 | tee /tmp/db-push-dry-run.txt
          grep -q "20261122031027" /tmp/db-push-dry-run.txt
          for version in \
            20261119125153 20261120154413 20261120164125 \
            20261121043115 20261121043149 20261121053647 \
            20261121053712 20261121053829 20261121054852 \
            20261121055722 20261121061000 20261121062000 \
            20261121125542 20261121133607 20261121140000 \
            20261121144209 20261121145500 20261121150452 \
            20261121152231 20261121153223 20261121154711 20261121155900; do
            if grep -q "${version}" /tmp/db-push-dry-run.txt; then
              echo "::error::Unexpected historical migration pending: ${version}"
              exit 1
            fi
          done
      - name: Apply only publish and rollback commands
        run: supabase db push --yes --remote="${SUPABASE_PROJECT_REF}"
      - name: Verify remote migration ledger
        run: |
          set -euo pipefail
          supabase migration list --remote="${SUPABASE_PROJECT_REF}" | tee /tmp/migrations-after.txt
          awk -F'|' '$2 ~ /20261122031027/ { found=1 } END { exit(found ? 0 : 1) }' /tmp/migrations-after.txt
          {
            echo "### Catalog publication and rollback V1"
            echo "- Project: ${SUPABASE_PROJECT_REF}"
            echo "- Migration: 20261122031027"
            echo "- Applied as the only pending migration after a clean dry-run."
            echo "- No menu rows, publications, Website or Edge Function deployments were created."
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
