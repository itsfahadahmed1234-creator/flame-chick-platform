name: Flame Chick Admin Static Checks

on:
  push:
    branches:
      - work/production-source-audit
      - cloudflare/admin-production
    paths:
      - "apps/flame-chick-admin/**"
      - "apps/flame-chick-pos/**"
      - "apps/flame-chick-rider/**"
      - "supabase/config.toml"
      - "supabase/functions/flame-chick-staff-admin/**"
      - "supabase/functions/flame-chick-order-api/**"
      - "supabase/functions/flame-chick-delivery-api/**"
      - "supabase/migrations/20261121053647_flame_chick_staff_admin_commands.sql"
      - "supabase/migrations/20261121054852_flame_chick_staff_command_definer_isolation.sql"
      - "supabase/migrations/20261125083051_flame_chick_staff_main_branch_rider_provisioning.sql"
      - "tests/staff-main-branch-rider-provisioning.test.mjs"
      - "tests/admin-invitation-acceptance.test.mjs"
      - "tests/admin-navigation-access.test.mjs"
      - "tests/catalog-v3-admin.test.mjs"
      - "tests/catalog-v3-importer.test.mjs"
      - "tests/edge-function-contract-hygiene.test.mjs"
      - "tests/staff-admin-origin-policy.test.mjs"
      - "tests/staff-admin-role-boundary.test.mjs"
      - ".github/workflows/ci-admin-static.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check apps/flame-chick-admin/app.js
          node --check apps/flame-chick-admin/catalog-v3-admin.js
          node --check apps/flame-chick-admin/catalog-v3-importer.js
          node --check apps/flame-chick-admin/accept-invitation.js
          node --test tests/admin-invitation-acceptance.test.mjs tests/admin-navigation-access.test.mjs tests/catalog-v3-admin.test.mjs tests/catalog-v3-importer.test.mjs tests/edge-function-contract-hygiene.test.mjs tests/staff-admin-origin-policy.test.mjs tests/staff-admin-role-boundary.test.mjs tests/staff-main-branch-rider-provisioning.test.mjs

      - name: Verify static page assets and invitation wiring
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from "node:fs";
          const root = "apps/flame-chick-admin/";
          const admin = readFileSync(root + "index.html", "utf8");
          const invite = readFileSync(root + "accept-invitation.html", "utf8");
          const inviteJs = readFileSync(root + "accept-invitation.js", "utf8");
          const adminDraft = readFileSync(root + "flame-chick-published-menu-2026-11-23.v3-draft.json", "utf8");
          const sourceDraft = readFileSync("ops/catalog-drafts/flame-chick-published-menu-2026-11-23.v3-draft.json", "utf8");
          if (adminDraft !== sourceDraft) throw new Error("Admin menu draft asset differs from the authoritative review draft.");
          for (const file of ["config.js", "app.js", "catalog-v3-admin.js", "catalog-v3-importer.js", "flame-chick-published-menu-2026-11-23.v3-draft.json", "catalog-v3-admin.css", "styles.css", "assets/flame-chick-mark.svg", "accept-invitation.html", "accept-invitation.js"]) {
            if (!existsSync(root + file)) throw new Error("Missing Admin asset: " + file);
          }
          if (!admin.includes('href="accept-invitation.html"')) throw new Error("Admin sign-in does not link to invitation acceptance.");
          if (!admin.includes('data-page="catalog-v3"')) throw new Error("Catalog V3 navigation entry is missing.");
          if (!admin.includes('id="page-catalog-v3"')) throw new Error("Catalog V3 page root is missing.");
          if (!admin.includes('src="catalog-v3-admin.js"')) throw new Error("Catalog V3 authoring module is not linked.");
          if (!admin.includes('src="catalog-v3-importer.js"')) throw new Error("Catalog V3 importer module is not linked.");
          if (!admin.includes('href="catalog-v3-admin.css"')) throw new Error("Catalog V3 workspace stylesheet is not linked.");
          if (!invite.includes('src="accept-invitation.js"')) throw new Error("Invitation page script is not linked.");
          if (!inviteJs.includes('action: "accept_invitation"')) throw new Error("Invitation page does not invoke the acceptance action.");
          if (!inviteJs.includes('authRequest("user", "GET"')) throw new Error("Invitation page does not verify the authenticated user.");
          console.log("Admin static assets and invitation wiring checks passed.");
          NODE
      - name: Verify POS and Rider browser scripts parse
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import vm from "node:vm";
          for (const file of ["apps/flame-chick-pos/index.html", "apps/flame-chick-rider/index.html"]) {
            const html = readFileSync(file, "utf8");
            let index = 0;
            for (const chunk of html.split("<script").slice(1)) {
              const tagEnd = chunk.indexOf(">");
              if (tagEnd < 0 || chunk.slice(0, tagEnd).toLowerCase().includes("src=")) continue;
              const close = chunk.indexOf("</script>", tagEnd + 1);
              if (close < 0) continue;
              const code = chunk.slice(tagEnd + 1, close).trim();
              if (code) new vm.Script(code, { filename: file + "-inline-" + index++ + ".js" });
            }
          }
          console.log("POS and Rider inline browser scripts parse successfully.");
          NODE
