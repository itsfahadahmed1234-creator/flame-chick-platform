name: Apply Flame Chick catalog command QA fixes

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "ops/triggers/apply-catalog-commands-qa-fixes.txt"

permissions:
  contents: read

concurrency:
  group: flame-chick-production-catalog-command-qa-fixes
  cancel-in-progress: false

jobs:
  apply-catalog-command-fixes:
    if: github.ref == 'refs/heads/work/production-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: adkrxfnawdiljhjaavnj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate target and forward migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_DB_PASSWORD}"
          configured_ref="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -n 1)"
          test "${configured_ref}" = "${SUPABASE_PROJECT_REF}"
          migration="supabase/migrations/20261121140000_flame_chick_catalog_commands_v1_qa_fixes.sql"
          test -s "${migration}"
          grep -q "p_action IS NULL" "${migration}"
          grep -q "jsonb_set" "${migration}"
          test "$(grep -c '^BEGIN;$' "${migration}")" -eq 1
          test "$(grep -c '^COMMIT;$' "${migration}")" -eq 1
      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --global "supabase@3.2.0"
          supabase --version
      - name: Link and inspect migration ledger
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_REF}"
          supabase migration list --remote="${SUPABASE_PROJECT_REF}" | tee /tmp/migrations-before.txt
          grep -q '20261121133607.*20261121133607' /tmp/migrations-before.txt
          if awk -F'|' '$2 ~ /20261121140000/ { found=1 } END { exit(found ? 0 : 1) }' /tmp/migrations-before.txt; then
            echo "::error::Forward QA fix already recorded remotely."
            exit 1
          fi
      - name: Dry-run and require only QA fix pending
        run: |
          set -euo pipefail
          supabase db push --dry-run --remote="${SUPABASE_PROJECT_REF}" 2>&1 | tee /tmp/dry-run.txt
          grep -q '20261121140000' /tmp/dry-run.txt
          if grep -Eq '20261119125153|20261120154413|20261120164125|20261121043115|20261121043149|20261121053647|20261121053712|20261121053829|20261121054852|20261121055722|20261121061000|20261121062000|20261121125542|20261121133607' /tmp/dry-run.txt; then
            echo "::error::Unexpected historical migration pending."
            exit 1
          fi
      - name: Apply one forward-only QA fix
        run: |
          set -euo pipefail
          supabase db push --yes --remote="${SUPABASE_PROJECT_REF}"
      - name: Verify migration ledger
        run: |
          set -euo pipefail
          supabase migration list --remote="${SUPABASE_PROJECT_REF}" | tee /tmp/migrations-after.txt
          grep -q '20261121140000.*20261121140000' /tmp/migrations-after.txt
          {
            echo "### Catalog command QA fixes"
            echo "- Project: ${SUPABASE_PROJECT_REF}"
            echo "- Migration: 20261121140000"
            echo "- Applied as a forward-only migration."
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
