name: Flame Chick Edge Function Static Checks

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "supabase/functions/**"
      - "apps/flame-chick-website/js/catalog-v3.js"
      - "apps/flame-chick-website/js/catalog-v3-deal-view.js"
      - "tests/flame-chick-order-pricing.test.mjs"
      - "tests/edge-function-contract-hygiene.test.mjs"
      - "tests/website-order-quote-token.test.mjs"
      - "supabase/functions/_shared/website-order-quote-token.mjs"
      - ".github/workflows/ci-edge-functions.yml"

permissions:
  contents: read

jobs:
  type-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.x"

      - name: Check Edge Function TypeScript
        run: |
          deno check supabase/functions/flame-chick-catalog/index.ts
          deno check supabase/functions/flame-chick-order-api/index.ts
          deno check supabase/functions/flame-chick-delivery-api/index.ts
          deno check supabase/functions/flame-chick-staff-admin/index.ts

      - name: Check Flame Chick RPC, catalog pricing and key contracts
        run: node --test tests/flame-chick-order-pricing.test.mjs tests/edge-function-contract-hygiene.test.mjs tests/website-order-quote-token.test.mjs
