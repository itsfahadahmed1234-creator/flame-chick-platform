name: Isolated Flame Chick POS Cloudflare Production Release

on:
  push:
    branches:
      - release/pos-rider-delivery-optimization-2026-11-28
    paths:
      - "apps/flame-chick-pos/**"
      - ".github/workflows/deploy-flame-chick-pos-isolated-release.yml"

permissions:
  contents: read

concurrency:
  group: flamechickpos-isolated-production-release
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/flame-chick-pos
    env:
      CLOUDFLARE_ACCOUNT_ID: 831422f51dea96c387ae8917d451a6bf
    steps:
      - name: Check out isolated POS release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install pinned Wrangler
        run: npm install --no-audit --no-fund

      - name: Run POS Worker and refresh regression tests
        run: npm run test:cloudflare

      - name: Build allowlisted public assets
        run: npm run build

      - name: Validate Wrangler production bundle without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/flamechickpos-isolated-dry-run --config wrangler.jsonc

      - name: Deploy existing Flame Chick POS Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config wrangler.jsonc
