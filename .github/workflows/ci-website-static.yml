name: Flame Chick Website Static Checks

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "apps/flame-chick-website/**"
      - "tests/website-source-hygiene.test.mjs"
      - ".github/workflows/ci-website-static.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check active JavaScript syntax
        run: |
          node --check apps/flame-chick-website/js/catalog.js
          node --check apps/flame-chick-website/js/config.js
          node --check apps/flame-chick-website/js/hero-slider.js
          node --check apps/flame-chick-website/js/i18n.js
          node --check apps/flame-chick-website/js/pricing.js
          node --check apps/flame-chick-website/js/store.js
          node --test tests/website-source-hygiene.test.mjs

      - name: Verify website inline scripts parse
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import vm from "node:vm";
          const html = readFileSync("apps/flame-chick-website/index.html", "utf8");
          const scripts = [...html.matchAll(/<script(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          for (const [index, match] of scripts.entries()) {
            const code = match[1].trim();
            if (code) new vm.Script(code, { filename: "website-inline-" + index + ".js" });
          }
          console.log("Website inline scripts parse successfully.");
          NODE
