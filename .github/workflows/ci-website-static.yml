name: Flame Chick Website Static Checks

on:
  push:
    branches:
      - work/production-source-audit
      - work/website-parallel-development
    paths:
      - "apps/flame-chick-website/**"
      - "tests/website-source-hygiene.test.mjs"
      - "tests/website-order-quote-token.test.mjs"
      - "supabase/functions/_shared/website-order-quote-token.mjs"
      - "tests/catalog-v3-contract.test.mjs"
      - "tests/catalog-v3-client.test.mjs"
      - "tests/catalog-v3-view.test.mjs"
      - "tests/catalog-v3-deal-view.test.mjs"
      - "tests/catalog-v3-deal-configurator.test.mjs"
      - "tests/branch-fulfilment-v3.test.mjs"
      - "tests/catalog-database-time-migration.test.mjs"
      - "tests/catalog-v3-preview.test.mjs"
      - "tests/catalog-preview-page.test.mjs"
      - "tests/local-catalog-preview-fixture.test.mjs"
      - "scripts/local-catalog-preview-fixture.mjs"
      - "supabase/migrations/20261123101105_flame_chick_catalog_database_time_metadata_v1.sql"
      - "supabase/migrations/20261123101126_flame_chick_deal_only_variant_pricing_v1.sql"
      - "tests/fixtures/catalog-v3-fixture.cjs"
      - "tests/published-menu-v3-draft.test.mjs"
      - "tests/fixtures/flame-chick-published-menu-v3-fixture.cjs"
      - "ops/catalog-drafts/flame-chick-published-menu-2026-11-23.v3-draft.json"
      - ".github/workflows/ci-website-static.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check active JavaScript syntax
        run: |
          node --check apps/flame-chick-website/js/catalog.js
          node --check apps/flame-chick-website/js/catalog-v3.js
          node --check apps/flame-chick-website/js/catalog-v3-client.js
          node --check apps/flame-chick-website/js/catalog-v3-view.js
          node --check apps/flame-chick-website/js/catalog-v3-deal-view.js
          node --check apps/flame-chick-website/js/catalog-v3-deal-configurator.js
          node --check apps/flame-chick-website/js/public-menu-v3.js
          node --check apps/flame-chick-website/js/branch-fulfilment-v3.js
          node --check apps/flame-chick-website/js/catalog-v3-preview.js
          node --check apps/flame-chick-website/js/catalog-preview-page.js
          node --check apps/flame-chick-website/js/website-order-v3.js
          node --check apps/flame-chick-website/js/config.js
          node --check apps/flame-chick-website/js/hero-slider.js
          node --check apps/flame-chick-website/js/i18n.js
          node --check apps/flame-chick-website/js/pricing.js
          node --check apps/flame-chick-website/js/store.js
          node --check scripts/local-catalog-preview-fixture.mjs

      - name: Run core catalog regression tests
        run: |
          node --test tests/website-source-hygiene.test.mjs tests/catalog-v3-contract.test.mjs tests/catalog-v3-client.test.mjs tests/catalog-v3-view.test.mjs tests/catalog-v3-deal-view.test.mjs tests/catalog-v3-deal-configurator.test.mjs tests/branch-fulfilment-v3.test.mjs tests/catalog-database-time-migration.test.mjs tests/published-menu-v3-draft.test.mjs

      - name: Run preview regression tests
        run: |
          node --test tests/catalog-v3-preview.test.mjs tests/catalog-preview-page.test.mjs tests/local-catalog-preview-fixture.test.mjs

      - name: Verify website inline scripts parse
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import vm from "node:vm";
          const html = readFileSync("apps/flame-chick-website/index.html", "utf8");
          const chunks = html.split("<script").slice(1);
          let inlineIndex = 0;
          for (const chunk of chunks) {
            const tagEnd = chunk.indexOf(">");
            if (tagEnd < 0) continue;
            const attributes = chunk.slice(0, tagEnd).toLowerCase();
            if (attributes.includes("src=")) continue;
            const close = chunk.indexOf("</script>", tagEnd + 1);
            if (close < 0) continue;
            const code = chunk.slice(tagEnd + 1, close).trim();
            if (code) new vm.Script(code, { filename: "website-inline-" + inlineIndex++ + ".js" });
          }
          const previewHtml = readFileSync("apps/flame-chick-website/catalog-preview.html", "utf8");
          const previewChunks = previewHtml.split("<script").slice(1);
          for (const chunk of previewChunks) {
            const tagEnd = chunk.indexOf(">");
            if (tagEnd < 0) continue;
            const attributes = chunk.slice(0, tagEnd).toLowerCase();
            if (attributes.includes("src=")) continue;
            const close = chunk.indexOf("</script>", tagEnd + 1);
            if (close < 0) continue;
            const code = chunk.slice(tagEnd + 1, close).trim();
            if (code) new vm.Script(code, { filename: "catalog-preview-inline.js" });
          }
          console.log("Website and preview inline scripts parse successfully.");
          NODE
