name: Flame Chick Catalog Admin API QA

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "supabase/functions/flame-chick-staff-admin/**"
      - "tests/catalog-admin-api.test.mjs"
      - "supabase/config.toml"
      - ".github/workflows/qa-catalog-admin-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flame-chick-catalog-admin-api-qa
  cancel-in-progress: false

jobs:
  catalog-api-contract:
    if: github.ref == 'refs/heads/work/production-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test catalog RPC route allowlist and request validation
        run: node --test tests/catalog-admin-api.test.mjs
      - name: Install pinned Deno
        run: |
          npm install --global "deno@2.9.8"
          deno --version
      - name: Type-check Staff Admin Edge Function and imported action router
        run: deno check supabase/functions/flame-chick-staff-admin/index.ts
