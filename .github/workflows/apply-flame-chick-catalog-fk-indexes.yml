name: Apply Flame Chick catalog FK indexes

on:
  push:
    branches:
      - work/production-source-audit
    paths:
      - "ops/triggers/apply-catalog-fk-indexes.txt"

permissions:
  contents: read

concurrency:
  group: flame-chick-production-catalog-fk-indexes
  cancel-in-progress: false

jobs:
  apply-catalog-fk-indexes:
    if: github.ref == 'refs/heads/work/production-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: adkrxfnawdiljhjaavnj
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check out reviewed working branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate secrets, project and migration files
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD}" || { echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; }

          configured_ref="$(sed -nE 's/^project_id[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' supabase/config.toml | head -n 1)"
          test "${configured_ref}" = "${SUPABASE_PROJECT_REF}" || { echo "::error::Project ref mismatch"; exit 1; }

          test -s supabase/migrations/20261121062000_flame_chick_catalog_fk_indexes.sql
          grep -q "current_user <> 'postgres' OR session_user <> 'postgres'" supabase/migrations/20261121062000_flame_chick_catalog_fk_indexes.sql

          echo "Target: ${SUPABASE_PROJECT_REF}"
          echo "Only pending migration expected: 20261121062000_flame_chick_catalog_fk_indexes.sql"

      - name: Install pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --global "supabase@3.2.0"
          supabase --version

      - name: Link Production and confirm foundation migration
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PROJECT_REF}"
          supabase migration list --remote="${SUPABASE_PROJECT_REF}" | tee /tmp/migrations-before.txt
          grep -q "20261121061000" /tmp/migrations-before.txt

      - name: Dry-run and enforce exactly one pending migration
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --dry-run --remote="${SUPABASE_PROJECT_REF}" 2>&1 | tee /tmp/db-push-dry-run.txt
          grep -q "20261121062000" /tmp/db-push-dry-run.txt

          # Every other migration file in this repository must already be present remotely.
          for version in \
            20261119125153 20261120154413 20261120164125 \
            20261121043115 20261121043149 20261121053647 \
            20261121053712 20261121053829 20261121054852 \
            20261121055722 20261121061000; do
            if grep -q "${version}" /tmp/db-push-dry-run.txt; then
              echo "::error::Unexpected pending migration ${version}; refusing to push."
              exit 1
            fi
          done

      - name: Apply the single reviewed FK-index migration
        run: |
          set -euo pipefail
          supabase db push --remote="${SUPABASE_PROJECT_REF}"

      - name: Verify migration history after push
        run: |
          set -euo pipefail
          supabase migration list --remote="${SUPABASE_PROJECT_REF}" | tee /tmp/migrations-after.txt
          grep -q "20261121062000" /tmp/migrations-after.txt
          {
            echo "### Catalog FK-index migration"
            echo "- Project: ${SUPABASE_PROJECT_REF}"
            echo "- Migration: 20261121062000"
            echo "- Applied through Supabase CLI after dry-run confirmed it was the only pending migration."
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
